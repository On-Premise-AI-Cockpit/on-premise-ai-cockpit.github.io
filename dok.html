<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dokument – Das KI-Cockpit</title>
  <style>
    :root { --bg:#f8fafc; --surface:#ffffff; --ink:#0f172a; --muted:#475569; --primary:#0f766e; --accent:#1e293b; --border:#e2e8f0; }
    * { box-sizing:border-box; }
    body { margin:0; font-family:"Segoe UI",system-ui,-apple-system,sans-serif; background:var(--bg); color:var(--ink); line-height:1.65; }
    .topbar { background:var(--accent); color:#f8fafc; padding:0.9rem 1.25rem; border-bottom:1px solid #334155; }
    .topbar-inner { max-width:960px; margin:0 auto; display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:0.75rem; }
    .back-link { color:#5eead4; text-decoration:none; font-weight:600; font-size:0.92rem; }
    .back-link:hover { text-decoration:underline; }
    .actions { display:flex; flex-wrap:wrap; gap:0.5rem; }
    .btn { display:inline-block; background:var(--primary); color:#fff; border:none; border-radius:7px; padding:0.48rem 0.9rem; font-size:0.86rem; font-weight:600; cursor:pointer; text-decoration:none; font-family:inherit; }
    .btn.sec { background:#334155; color:#f1f5f9; }
    .btn:hover { opacity:0.92; }
    .doc-tabs { max-width:960px; margin:1.25rem auto 0; padding:0 1.25rem; display:flex; flex-wrap:wrap; gap:0.45rem; }
    .doc-tab { display:inline-block; padding:0.4rem 0.85rem; border-radius:999px; font-size:0.84rem; font-weight:600; text-decoration:none; color:var(--muted); background:var(--surface); border:1px solid var(--border); }
    .doc-tab.active { background:#f0fdfa; color:var(--primary); border-color:#99f6e4; }
    .doc-tab:hover { border-color:var(--primary); }
    main { max-width:960px; margin:1rem auto 3rem; padding:0 1.25rem; }
    article { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:2rem 2.25rem; box-shadow:0 2px 10px rgba(15,23,42,0.04); }
    article h1 { margin:0 0 1rem; font-size:1.75rem; line-height:1.25; color:var(--ink); border-bottom:2px solid var(--border); padding-bottom:0.65rem; }
    article h2 { margin:2rem 0 0.7rem; font-size:1.28rem; color:var(--ink); }
    article h3 { margin:1.4rem 0 0.5rem; font-size:1.05rem; color:var(--accent); }
    article p { margin:0 0 0.9rem; color:#1e293b; font-size:0.96rem; }
    article ul, article ol { margin:0 0 1rem; padding-left:1.45rem; color:#1e293b; font-size:0.95rem; }
    article li { margin-bottom:0.4rem; }
    article hr { border:none; border-top:1px solid var(--border); margin:1.75rem 0; }
    article code { font-family:Consolas,ui-monospace,monospace; font-size:0.86em; background:#f1f5f9; border:1px solid var(--border); border-radius:4px; padding:0.1rem 0.35rem; color:#0f172a; }
    article pre { background:#0f172a; color:#f8fafc; border-radius:8px; padding:1rem 1.15rem; overflow-x:auto; margin:0.9rem 0 1.2rem; font-size:0.85rem; line-height:1.5; }
    article pre code { background:none; border:none; padding:0; color:inherit; font-size:inherit; }
    .alert { background:#f0fdfa; border:1px solid #99f6e4; border-left:4px solid var(--primary); border-radius:8px; padding:0.95rem 1.15rem; margin:1rem 0 1.25rem; font-size:0.94rem; color:#134e4a; }
    .alert-title { font-weight:700; text-transform:uppercase; font-size:0.78rem; letter-spacing:0.04em; color:var(--primary); margin-bottom:0.3rem; }
    .table-wrap { overflow-x:auto; margin:1rem 0 1.4rem; }
    article table { width:100%; border-collapse:collapse; font-size:0.88rem; }
    article th, article td { border:1px solid var(--border); padding:0.55rem 0.7rem; text-align:left; vertical-align:top; }
    article th { background:#f1f5f9; font-weight:700; color:var(--ink); }
    article tr:nth-child(even) td { background:#fafcff; }
    .hint { color:var(--muted); font-size:0.92rem; }
    footer { text-align:center; font-size:0.84rem; color:var(--muted); padding:1.5rem; border-top:1px solid var(--border); }
    footer a { color:var(--primary); text-decoration:none; }
    footer a:hover { text-decoration:underline; }
    @media (max-width: 640px) { article { padding:1.25rem 1.1rem; } }
    @media print {
      .topbar, .doc-tabs, footer { display:none !important; }
      body { background:#fff; }
      main { max-width:none; margin:0; padding:0; }
      article { border:none; box-shadow:none; padding:0; }
      article table { font-size:0.82rem; }
      article h2, article h3 { break-after:avoid; }
      article tr { break-inside:avoid; }
    }
  </style>
</head>
<body>
  <div class="topbar">
    <div class="topbar-inner">
      <a class="back-link" href="index.html">&larr; Zurück zur Übersicht (Das KI-Cockpit)</a>
      <div class="actions">
        <button class="btn" type="button" onclick="window.print()">Drucken / Als PDF speichern</button>
        <a id="raw-link" class="btn sec" href="#" download>Original (.md) herunterladen</a>
      </div>
    </div>
  </div>

  <nav class="doc-tabs" aria-label="Dokumente">
    <a class="doc-tab" data-doc="betrieb-uebergabe/UEBERGABEPAKET_IT_PERSONALRAT.md" href="dok.html?datei=betrieb-uebergabe/UEBERGABEPAKET_IT_PERSONALRAT.md">Übergabepaket (IT &amp; Personalrat)</a>
    <a class="doc-tab" data-doc="betrieb-uebergabe/LIESMICH_TEAM.md" href="dok.html?datei=betrieb-uebergabe/LIESMICH_TEAM.md">Team-Anleitung</a>
    <a class="doc-tab" data-doc="libs/README_LIBS.md" href="dok.html?datei=libs/README_LIBS.md">Offline-Anleitung (/libs)</a>
  </nav>

  <main>
    <article id="doc-content">
      <p class="hint">Dokument wird geladen …</p>
    </article>
  </main>

  <footer>
    Michael Estel – „Das KI-Cockpit“ (2026) &middot;
    <a href="https://estel.email/" style="font-weight:600;">Übersicht, Bücher &amp; Kontakt (estel.email)</a> &middot;
    <a href="https://estel.email/impressum.html">Impressum</a> &middot;
    <a href="https://estel.email/datenschutz.html">Datenschutz</a>
  </footer>

  <script>
    const ALLOWED = {
      "betrieb-uebergabe/UEBERGABEPAKET_IT_PERSONALRAT.md": "Übergabepaket (IT, ISB, DSB & Personalrat)",
      "betrieb-uebergabe/LIESMICH_TEAM.md": "Kurze Anleitung für das Team",
      "libs/README_LIBS.md": "Offline-Anleitung & Bibliotheksliste (/libs)"
    };

    function esc(s) {
      return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
    }

    function inlineMd(text) {
      let s = esc(text);
      const codes = [];
      s = s.replace(/`([^`]+)`/g, (_, c) => {
        codes.push("<code>" + c + "</code>");
        return "\x00C" + (codes.length - 1) + "\x00";
      });
      s = s.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
      s = s.replace(/\*([^*]+)\*/g, "<em>$1</em>");
      s = s.replace(/\x00C(\d+)\x00/g, (_, i) => codes[Number(i)]);
      return s;
    }

    function renderMarkdown(md) {
      const lines = md.replace(/\r\n/g, "\n").split("\n");
      const out = [];
      let i = 0;

      while (i < lines.length) {
        const line = lines[i];

        if (!line.trim()) { i++; continue; }

        // Fenced code block
        if (line.trim().startsWith("```")) {
          const buf = [];
          i++;
          while (i < lines.length && !lines[i].trim().startsWith("```")) {
            buf.push(esc(lines[i]));
            i++;
          }
          i++;
          out.push("<pre><code>" + buf.join("\n") + "</code></pre>");
          continue;
        }

        // Horizontal rule
        if (/^---+$/.test(line.trim())) {
          out.push("<hr />");
          i++;
          continue;
        }

        // Headings
        const h = line.match(/^(#{1,3})\s+(.*)$/);
        if (h) {
          const lvl = h[1].length;
          out.push(`<h${lvl}>${inlineMd(h[2].trim())}</h${lvl}>`);
          i++;
          continue;
        }

        // Blockquote / GitHub Alert
        if (line.trim().startsWith(">")) {
          const qLines = [];
          while (i < lines.length && lines[i].trim().startsWith(">")) {
            qLines.push(lines[i].trim().replace(/^>\s?/, ""));
            i++;
          }
          let title = "";
          if (qLines[0] && /^\[!(IMPORTANT|NOTE|TIP|WARNING)\]/i.test(qLines[0])) {
            title = "Wichtiger Hinweis";
            qLines.shift();
          }
          out.push(
            '<div class="alert">' +
            (title ? '<div class="alert-title">' + title + '</div>' : '') +
            inlineMd(qLines.join(" ")) +
            '</div>'
          );
          continue;
        }

        // Pipe table
        if (line.trim().startsWith("|") && i + 1 < lines.length && /^\|[\s:-]+\|/.test(lines[i + 1].trim())) {
          const parseRow = (r) => r.trim().replace(/^\|/, "").replace(/\|$/, "").split("|").map((c) => c.trim());
          const headers = parseRow(line);
          i += 2;
          const rows = [];
          while (i < lines.length && lines[i].trim().startsWith("|")) {
            rows.push(parseRow(lines[i]));
            i++;
          }
          let html = '<div class="table-wrap"><table><thead><tr>';
          headers.forEach((c) => { html += "<th>" + inlineMd(c) + "</th>"; });
          html += "</tr></thead><tbody>";
          rows.forEach((r) => {
            html += "<tr>";
            for (let c = 0; c < headers.length; c++) {
              html += "<td>" + inlineMd(r[c] || "") + "</td>";
            }
            html += "</tr>";
          });
          html += "</tbody></table></div>";
          out.push(html);
          continue;
        }

        // Unordered list
        if (/^-\s+/.test(line.trim())) {
          const items = [];
          while (i < lines.length && /^-\s+/.test(lines[i].trim())) {
            items.push("<li>" + inlineMd(lines[i].trim().replace(/^-\s+/, "")) + "</li>");
            i++;
          }
          out.push("<ul>" + items.join("") + "</ul>");
          continue;
        }

        // Ordered list
        if (/^\d+\.\s+/.test(line.trim())) {
          const items = [];
          while (i < lines.length && (/^\d+\.\s+/.test(lines[i].trim()) || /^\s{2,}\S/.test(lines[i]))) {
            if (/^\d+\.\s+/.test(lines[i].trim())) {
              items.push(inlineMd(lines[i].trim().replace(/^\d+\.\s+/, "")));
            } else if (items.length) {
              items[items.length - 1] += " " + inlineMd(lines[i].trim());
            }
            i++;
          }
          out.push("<ol>" + items.map((t) => "<li>" + t + "</li>").join("") + "</ol>");
          continue;
        }

        // Paragraph
        const pLines = [];
        while (
          i < lines.length &&
          lines[i].trim() &&
          !/^(#{1,3}\s|---|```|>|\||-\s|\d+\.\s)/.test(lines[i].trim())
        ) {
          pLines.push(lines[i].trim());
          i++;
        }
        out.push("<p>" + inlineMd(pLines.join(" ")) + "</p>");
      }

      return out.join("\n");
    }

    async function loadDoc() {
      const params = new URLSearchParams(window.location.search);
      const requested = params.get("datei") || "betrieb-uebergabe/UEBERGABEPAKET_IT_PERSONALRAT.md";
      const file = ALLOWED[requested] ? requested : "betrieb-uebergabe/UEBERGABEPAKET_IT_PERSONALRAT.md";

      document.title = ALLOWED[file] + " – Das KI-Cockpit";
      const rawLink = document.getElementById("raw-link");
      rawLink.href = file;
      document.querySelectorAll(".doc-tab").forEach((el) => {
        el.classList.toggle("active", el.dataset.doc === file);
      });

      const container = document.getElementById("doc-content");
      try {
        const res = await fetch(file);
        if (!res.ok) throw new Error("HTTP " + res.status);
        const text = await res.text();
        container.innerHTML = renderMarkdown(text);
      } catch (err) {
        container.innerHTML =
          '<h1>Hinweis</h1><p>Das Dokument konnte nicht geladen werden (beim Öffnen per Doppelklick blockieren Browser das Nachladen lokaler Dateien).</p>' +
          '<p>Öffnen Sie die Originaldatei direkt: <a href="' + esc(file) + '">' + esc(file) + '</a></p>';
      }
    }

    loadDoc();
  </script>
</body>
</html>
